config_modifications:
  general:
    remove_from_config: ["W", "DYNLO", "DY", "TT", "VV", "qqH125", "qqH", "ggH125", "ggH", "Embedded", "EMB"]
    rename:
      processes:
        data: data
      subprocesses:
        data: data
    add_era_and_process_name_flags: true
  specific:
    keep_variations:
      - none
