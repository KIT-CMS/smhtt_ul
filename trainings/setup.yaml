config_modifications:
  general:
    remove_from_config: ["W", "DYNLO"]
    rename:
      processes:
        data: jetFakes
      subprocesses:
        data: jetFakes
    add_era_and_process_name_flags: true
  specific:
    add_anti_iso_cut_and_weight_version: true

dataset_modifications:
  subprocesses_to_skip: # due to FFs (jetFakes)
    - DY-ZJ
    - TT-TTJ
    - VV-VVJ
    - ST-STJ
  labels:
    renaming_map:
      # "is_ggh_htautau": "is_ggH__ggH125",
      # "is_vbf_htautau": "is_VBF__VBF125",  
      is_dyjets: is_DY__DY_ZL
      is_ttbar: is_TT__TT_TTL
      is_diboson: is_VV__VV_VVL
      is_jetFakes: is_data
      # is_DY__DY_ZJ: is_DY__DY_ZJ
      is_DY__DY_ZL: is_DY__DY_ZL
      is_DY__DY_ZTT: is_DY__DY_ZTT
      is_HH2B2Tau__HH2B2Tau: is_HH2B2Tau__HH2B2Tau
      # is_ST__ST_STJ: is_ST__ST_STJ
      is_ST__ST_STL: is_ST__ST_STL
      is_ST__ST_STT: is_ST__ST_STT
      # is_TT__TT_TTJ: is_TT__TT_TTJ
      is_TT__TT_TTL: is_TT__TT_TTL
      is_TT__TT_TTT: is_TT__TT_TTT
      is_VH__VH125: is_VH__VH125
      # is_VV__VV_VVJ: is_VV__VV_VVJ
      is_VV__VV_VVL: is_VV__VV_VVL
      is_VV__VV_VVT: is_VV__VV_VVT
      is_ggH__ggH125: is_ggH__ggH125
      is_jetFakes__jetFakes: is_jetFakes__jetFakes
      is_qqH__qqH125: is_qqH__qqH125
      is_ttH__ttH125: is_ttH__ttH125
  selections:
    is_jetFakes: anti_iso
    # everything not mentioned here but present in labels renaming_mapping is set to nominal

