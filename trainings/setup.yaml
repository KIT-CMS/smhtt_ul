config_modifications:
  general:
    remove_from_config: ["W", "DYNLO"]
    rename:
      processes:
        data: jetFakes
      subprocesses:
        data: jetFakes
    add_era_and_process_name_flags: true
  specific:
    add_anti_iso_cut_and_weight_version: true
    keep_variations:
      # ---
      - .*anti_iso$
      - .*same_sign$
      - .*same_sign_anti_iso$
      # ---
      - .*BR_htt.*
      - .*CMS_PileUp
      - .*CMS_QCD_DR_SR_correction.*
      - .*CMS_QCD_non_closure_Corr.*
      - .*CMS_Wjets_DR_SR_correctionStat_.*
      - .*CMS_Wjets_non_closure_Corr.*
      - .*CMS_ZLShape_mt_.*
      - .*CMS_btag_.*
      - .*CMS_eff_m.*
      - .*CMS_eff_t_.*
      - .*CMS_eff_trigger_.*
      - .*CMS_fake_m_WH.*
      - .*CMS_ff_QCD.*
      - .*CMS_ff_Wjets.*
      - .*CMS_ff_ttbarStat.*
      - .*CMS_fractions_.*
      - .*CMS_htt_.*
      - .*CMS_res_j_.*
      - .*CMS_scale_j_Absolute
      - .*CMS_scale_j_Absolute_.*2018
      - .*CMS_scale_j_BBEC1
