config_modifications:
  general:
    remove_from_config: ["W"] #"DYNLO"
    rename:
      processes:
        data: jetFakes
      subprocesses:
        data: jetFakes
    add_era_and_process_name_flags: true
  specific:
    add_anti_iso_cut_and_weight_version: true

dataset_modifications:
  subprocesses_to_skip:
    ## covered by emebedding - not available currently
    # - DY-ZTT
    # - VV-VVT
    # - TT-TTT
    ## covered by jetFakes with FF
    - DY-ZJ
    - TT-TTJ
    - VV-VVJ
    ## why remove signal ??
    # - qqH125
    # - ggH125
  labels:
    renaming_map:
      # stxs stgae 0
      is_ggh_htautau: is_ggH__ggH125
      is_vbf_htautau: is_qqH__qqH125
      is_dyjets_tt: is_DY__DY_ZTT
      is_dyjets_ll: is_DY__DY_ZL
      # combine category for dyjets for tt channel
      is_dyjets:
       - is_DY__DY_ZTT
       - is_DY__DY_ZL
      is_embedding: is_EMB__Embedded
      is_ttbar: 
        - is_TT__TT_TTL
        - is_TT__TT_TTT
      is_diboson: 
        - is_VV__VV_VVL
        - is_VV__VV_VVT
      is_jetFakes: is_data
      # combined category for subleading backgrounds
      is_bkg_rest: 
        - is_TT__TT_TTL
        - is_TT__TT_TTT
        - is_VV__VV_VVL
        - is_VV__VV_VVT
      # recombined stxs stage 1.2
      is_ggh_htautau_bin101to104:
        - is_ggH__ggH125_ggh_htautau_bin101_selection
        - is_ggH__ggH125_ggh_htautau_bin102_selection
        - is_ggH__ggH125_ggh_htautau_bin103_selection
        - is_ggH__ggH125_ggh_htautau_bin104_selection
      is_ggh_htautau_bin105:
        - is_ggH__ggH125_ggh_htautau_bin105_selection
      is_ggh_htautau_bin106:
        - is_ggH__ggH125_ggh_htautau_bin106_selection
      is_ggh_htautau_bin107:
        - is_ggH__ggH125_ggh_htautau_bin107_selection
      is_ggh_htautau_bin108:
        - is_ggH__ggH125_ggh_htautau_bin108_selection
      is_ggh_htautau_bin109:
        - is_ggH__ggH125_ggh_htautau_bin109_selection
      is_ggh_htautau_bin110to112:
        - is_ggH__ggH125_ggh_htautau_bin110_selection
        - is_ggH__ggH125_ggh_htautau_bin111_selection
        - is_ggH__ggH125_ggh_htautau_bin112_selection
      is_ggh_htautau_bin113to116:
        - is_ggH__ggH125_ggh_htautau_bin113_selection
        - is_ggH__ggH125_ggh_htautau_bin114_selection
        - is_ggH__ggH125_ggh_htautau_bin115_selection
        - is_ggH__ggH125_ggh_htautau_bin116_selection
      is_vbf_htautau_bin201to202:
        - is_qqH__qqH125_vbf_htautau_bin201_selection
        - is_qqH__qqH125_vbf_htautau_bin202_selection
      is_vbf_htautau_bin203to205:
        - is_qqH__qqH125_vbf_htautau_bin203_selection
        - is_qqH__qqH125_vbf_htautau_bin204_selection
        - is_qqH__qqH125_vbf_htautau_bin205_selection
      is_vbf_htautau_bin206:
        - is_qqH__qqH125_vbf_htautau_bin206_selection
      is_vbf_htautau_bin207to208:
        - is_qqH__qqH125_vbf_htautau_bin207_selection
        - is_qqH__qqH125_vbf_htautau_bin208_selection
      is_vbf_htautau_bin209to210:
        - is_qqH__qqH125_vbf_htautau_bin209_selection
        - is_qqH__qqH125_vbf_htautau_bin210_selection
  selections:
    is_dyjets: anti_iso+nominal
    is_dyjets_tt: anti_iso+nominal
    is_dy_ll: anti_iso+nominal
    is_embedding: anti_iso+nominal
    is_ttbar: anti_iso+nominal
    is_diboson: anti_iso+nominal
    is_bkg_rest: anti_iso+nominal
    is_jetFakes: anti_iso
    # everything not mentioned here but present in labels renaming_mapping is set to nominal

